[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "dea-artifactguard"
version = "2.0.0"
description = "Coordinate-granular reconstruction-path analysis and release hardening for DEA result artifacts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]
[project.scripts]
artifactguard = "dea_artifactguard.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
